<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #111827; /* 👈 oscuro más claro y limpio */
  --card: #1f2937;
  --accent: #3b82f6;
  --text: #e5e7eb;
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* PANTALLAS (sin position absolute → evita lag) */
.screen {
  display: none;
  min-height: 100vh;
}

.active {
  display: block;
  animation: fadeSmooth 0.35s ease;
}

/* ANIMACIÓN LIVIANA */
@keyframes fadeSmooth {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* CONTENEDOR */
.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

/* BOTONES */
button {
  padding: 14px 26px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  cursor: pointer;
  transition: transform 0.2s ease;
}

button:active {
  transform: scale(0.97);
}

/* BACK */
.back {
  position: fixed;
  top: 15px;
  left: 15px;
  background: #1f2937;
  padding: 10px 14px;
  border-radius: 10px;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
    url("img/inicio.jpeg") center/cover no-repeat;
}

/* TARJETAS */
.card {
  position: relative;
  height: 220px;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 15px;
  cursor: pointer;
  background: var(--card);
  transition: transform 0.25s ease;
}

.card:hover {
  transform: translateY(-4px);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.85);
}

.overlay-text {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 14px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
}

/* DETALLE */
.hero-img img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 14px;
}

.problem {
  background: #1f2937;
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
  border-left: 4px solid var(--accent);
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .card { height: 180px; }
  .hero-img img { height: 220px; }
}
</style>
</head>

<body>

<div id="inicio" class="screen active">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones en energía y aire comprimido</p>
    <button onclick="ir('menu')">Explorar</button>
  </div>
</div>

<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <div class="container">
    <h2>Seleccioná un equipo</h2>

    <div class="card" onclick="verEquipo('grupo')">
      <img src="img/grupoelectrogeno.jpeg">
      <div class="overlay-text">Grupo electrógeno</div>
    </div>

    <div class="card" onclick="verEquipo('moto')">
      <img src="img/moto.jpg">
      <div class="overlay-text">Motocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('electro')">
      <img src="img/electro.jpg">
      <div class="overlay-text">Electrocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('torre')">
      <img src="img/torre.jpg">
      <div class="overlay-text">Torre iluminación</div>
    </div>

  </div>
</div>

<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <div class="container">
    <div class="hero-img">
      <img id="imagen">
    </div>

    <h2 id="titulo"></h2>
    <p id="descripcion"></p>

    <div id="problemas"></div>
  </div>
</div>

<script>
function ir(pantalla) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(pantalla).classList.add('active');
}

function verEquipo(nombre) {
  let data = {
    grupo: {
      titulo: "Grupo electrógeno",
      img: "img/grupoelectrogeno.jpeg",
      desc: "Energía confiable para operaciones críticas.",
      problemas: ["Sobrecalentamiento", "Bajo rendimiento"]
    },
    moto: {
      titulo: "Motocompresor",
      img: "img/moto.jpg",
      desc: "Compresión eficiente.",
      problemas: ["Baja presión"]
    },
    electro: {
      titulo: "Electrocompresor",
      img: "img/electro.jpg",
      desc: "Soluciones eléctricas.",
      problemas: ["Fugas"]
    },
    torre: {
      titulo: "Torre iluminación",
      img: "img/torre.jpg",
      desc: "Iluminación industrial.",
      problemas: ["Falla"]
    }
  };

  let eq = data[nombre];

  document.getElementById("titulo").innerText = eq.titulo;
  document.getElementById("descripcion").innerText = eq.desc;
  document.getElementById("imagen").src = eq.img;

  let cont = document.getElementById("problemas");
  cont.innerHTML = "";

  eq.problemas.forEach(p => {
    let div = document.createElement("div");
    div.className = "problem";
    div.innerText = p;
    cont.appendChild(div);
  });

  ir("detalle");
}
</script>

</body>
</html>
