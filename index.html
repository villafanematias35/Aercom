<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #111827;
  --card: #1f2937;
  --accent: #3b82f6;
  --text: #e5e7eb;
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* PANTALLAS */
.screen {
  display: none;
  min-height: 100vh;
}

.active {
  display: block;
  animation: fadeSmooth 0.3s ease;
}

@keyframes fadeSmooth {
  from { opacity: 0; transform: translateY(10px);}
  to { opacity: 1; transform: translateY(0);}
}

/* CONTENEDOR (más aire) */
.container {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

/* BOTONES */
button {
  padding: 14px 26px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  cursor: pointer;
}

/* BOTÓN VOLVER PRO */
.back {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1000;

  background: rgba(31,41,55,0.95);
  backdrop-filter: blur(6px);

  padding: 14px 16px;
  font-size: 18px;
  border-radius: 14px;

  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
    url("img/inicio.jpeg") center/cover no-repeat;
}

/* TARJETAS MEJORADAS */
.card {
  position: relative;
  height: 260px; /* 👈 más estiradas */
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 25px; /* 👈 más separación */
  cursor: pointer;
  background: var(--card);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* hover */
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

/* 👉 click (táctil) */
.card:active {
  transform: scale(0.96);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.9);
}

.overlay-text {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 18px;
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(0,0,0,0.6));
}

/* DETALLE (intacto) */
.hero-img img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 14px;
}

.problem {
  background: #1f2937;
  padding: 12px;
  border-radius: 10px;
  margin: 10px 0;
  border-left: 4px solid var(--accent);
}

/* evita que el botón tape contenido */
#menu .container,
#detalle .container {
  margin-top: 60px;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .card { height: 200px; }
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="screen active">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones en energía y aire comprimido</p>
    <button onclick="ir('menu')">Explorar</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <div class="container">
    <h2>Seleccioná un equipo</h2>

    <div class="card" onclick="verEquipo('grupo')">
      <img src="img/grupoelectrogeno.jpeg">
      <div class="overlay-text">Grupo electrógeno</div>
    </div>

    <div class="card" onclick="verEquipo('moto')">
      <img src="img/moto.jpg">
      <div class="overlay-text">Motocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('electro')">
      <img src="img/electro.jpg">
      <div class="overlay-text">Electrocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('torre')">
      <img src="img/torre.jpg">
      <div class="overlay-text">Torre iluminación</div>
    </div>

  </div>
</div>

<!-- DETALLE -->
<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <div class="container">
    <div class="hero-img">
      <img id="imagen">
    </div>

    <h2 id="titulo"></h2>
    <p id="descripcion"></p>

    <div id="contenido"></div>
  </div>
</div>

<script>

/* transición suave */
function ir(pantalla) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

  let next = document.getElementById(pantalla);
  next.classList.add('active');
}

function verEquipo(nombre) {

  let data = {
    grupo: {
      titulo: "Grupo electrógeno",
      img: "img/grupoelectrogeno.jpeg",
      desc: "Equipos diseñados para garantizar suministro eléctrico continuo en operaciones críticas.",
      problemas: [
        "Sobrecalentamiento",
        "Bajo rendimiento",
        "Fallas eléctricas",
        "Aceite degradado"
      ],
      soluciones: [
        "Mantenimiento del sistema de refrigeración",
        "Cambio de filtros",
        "Diagnóstico eléctrico",
        "Revisión del sistema de inyección"
      ],
      servicios: [
        "Mantenimiento preventivo",
        "Cambio de aceite y filtros",
        "Controles operativos",
        "Servicio técnico en campo"
      ]
    },

    moto: {
      titulo: "Motocompresor",
      img: "img/moto.jpg",
      desc: "Equipos de aire comprimido para uso industrial.",
      problemas: ["Baja presión", "Ruido", "Fugas"],
      soluciones: ["Ajuste de válvulas", "Revisión mecánica", "Sellado"],
      servicios: ["Mantenimiento", "Cambio de aceite", "Control de presión"]
    },

    electro: {
      titulo: "Electrocompresor",
      img: "img/electro.jpg",
      desc: "Compresores eléctricos eficientes.",
      problemas: ["Paradas", "Fallas eléctricas"],
      soluciones: ["Diagnóstico", "Reparación"],
      servicios: ["Mantenimiento", "Control eléctrico"]
    },

    torre: {
      titulo: "Torre iluminación",
      img: "img/torre.jpg",
      desc: "Equipos de iluminación para obra.",
      problemas: ["Falla luz", "Batería"],
      soluciones: ["Cambio lámparas", "Revisión"],
      servicios: ["Mantenimiento", "Control eléctrico"]
    }
  };

  let eq = data[nombre];

  document.getElementById("titulo").innerText = eq.titulo;
  document.getElementById("descripcion").innerText = eq.desc;
  document.getElementById("imagen").src = eq.img;

  let cont = document.getElementById("contenido");
  cont.innerHTML = "";

  function crearBloque(titulo, lista) {
    let h = document.createElement("h3");
    h.innerText = titulo;
    cont.appendChild(h);

    lista.forEach(item => {
      let div = document.createElement("div");
      div.className = "problem";
      div.innerText = item;
      cont.appendChild(div);
    });
  }

  crearBloque("Problemas comunes", eq.problemas);
  crearBloque("Soluciones Aercom", eq.soluciones);
  crearBloque("Servicios", eq.servicios);

  ir("detalle");
}

</script>

</body>
</html>
