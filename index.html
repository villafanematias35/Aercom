<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg1: #0b1a33;
  --bg2: #0f172a;
  --card: #111827;
  --accent: #3b82f6;
  --text: #e2e8f0;
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #0b1f3a; /* 👈 color sólido limpio */
  color: #e2e8f0;
}

/* CONTENEDOR */
.container {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}

/* PANTALLAS */
.screen { display: none; }
.active { display: block; }

/* ANIMACIÓN */
.fade {
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from {opacity:0; transform: translateY(15px);}
  to {opacity:1; transform: translateY(0);}
}

/* BOTONES */
button {
  padding: 14px 26px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: white;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
}

/* BACK */
.back {
  position: fixed;
  top: 15px;
  left: 15px;
  background: rgba(15,23,42,0.8);
  padding: 10px 14px;
  border-radius: 10px;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  background:
    linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)),
    url("img/inicio.jpeg") center/cover no-repeat;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  margin: 10px 0 30px;
  opacity: 0.85;
}

/* TARJETAS */
.card {
  position: relative;
  height: 220px;
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 20px;
  cursor: pointer;
  transition: 0.3s;
  background: var(--card);
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.4);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.75);
}

.overlay-text {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 18px;
  font-size: 20px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
}

/* DETALLE */
.hero-img img {
  width: 100%;
  height: 300px;
  object-fit: cover;
  border-radius: 18px;
}

.overlay {
  margin-top: 10px;
  padding: 10px 0;
  font-size: 24px;
  font-weight: 600;
}

#descripcion {
  opacity: 0.9;
  margin-bottom: 20px;
}

/* PROBLEMAS */
.problem {
  background: rgba(255,255,255,0.08);
  border-left: 4px solid #60a5fa;
}

/* RESPONSIVE */
@media (max-width: 600px) {
  .hero h1 { font-size: 30px; }
  .card { height: 180px; }
  .hero-img img { height: 220px; }
}
.screen {
  display: none;
  min-height: 100vh; /* 👈 ocupa toda la pantalla */
  background: #0b1f3a; /* 👈 evita cortes */
}  
</style>
</head>

<body>

<div id="inicio" class="screen active fade">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones en energía y aire comprimido</p>
    <button onclick="ir('menu')">Explorar</button>
  </div>
</div>

<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <div class="container">
    <h2 style="margin-top:50px;">Seleccioná un equipo</h2>

    <div class="card" onclick="verEquipo('grupo')">
      <img src="img/grupoelectrogeno.jpeg">
      <div class="overlay-text">⚡ Grupo electrógeno</div>
    </div>

    <div class="card" onclick="verEquipo('moto')">
      <img src="img/moto.jpg">
      <div class="overlay-text">🔧 Motocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('electro')">
      <img src="img/electro.jpg">
      <div class="overlay-text">🌀 Electrocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('torre')">
      <img src="img/torre.jpg">
      <div class="overlay-text">💡 Torre de iluminación</div>
    </div>

  </div>
</div>

<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <div class="container">
    <div class="hero-img">
      <img id="imagen" src="">
    </div>

    <div class="overlay">
      <div id="titulo"></div>
    </div>

    <p id="descripcion"></p>

    <h3>Soluciones</h3>
    <div id="problemas"></div>
  </div>
</div>

<script>
function ir(pantalla) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active','fade');
  });
  let screen = document.getElementById(pantalla);
  screen.classList.add('active','fade');
}

function verEquipo(nombre) {
  let data = {
    grupo: {
      titulo: "Grupo electrógeno",
      img: "img/grupoelectrogeno.jpeg",
      desc: "Energía confiable para operaciones críticas.",
      problemas: [
        "🔥 Sobrecalentamiento → Limpieza de radiador",
        "⚠️ Bajo rendimiento → Cambio de filtros",
        "🔌 Fallas eléctricas → Diagnóstico completo"
      ]
    },
    moto: {
      titulo: "Motocompresor",
      img: "img/moto.jpg",
      desc: "Compresión eficiente para uso industrial.",
      problemas: [
        "⚠️ Baja presión → Ajuste de válvulas",
        "🔧 Ruido → Revisión mecánica"
      ]
    },
    electro: {
      titulo: "Electrocompresor",
      img: "img/electro.jpg",
      desc: "Soluciones eléctricas eficientes.",
      problemas: [
        "⛔ Paradas → Control eléctrico",
        "💨 Fugas → Sellado"
      ]
    },
    torre: {
      titulo: "Torre de iluminación",
      img: "img/torre.jpg",
      desc: "Iluminación para obras y eventos.",
      problemas: [
        "💡 Falla de luz → Cambio de lámparas",
        "🔋 Batería → Revisión eléctrica"
      ]
    }
  };

  let eq = data[nombre];

  document.getElementById("titulo").innerText = eq.titulo;
  document.getElementById("descripcion").innerText = eq.desc;
  document.getElementById("imagen").src = eq.img;

  let cont = document.getElementById("problemas");
  cont.innerHTML = "";

  eq.problemas.forEach(p => {
    let div = document.createElement("div");
    div.className = "problem";
    div.innerHTML = "➡️ " + p;
    cont.appendChild(div);
  });

  ir("detalle");
}
</script>

</body>
</html>
