<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: #111827;
  color: #e5e7eb;
}

.screen { display: none; min-height: 100vh; }
.active { display: block; }

.container { max-width: 800px; margin: auto; padding: 20px; }

.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  background:
    linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)),
    url("img/inicio.jpeg") center/cover no-repeat;
}

button {
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.card {
  height: 200px;
  margin-bottom: 15px;
  border-radius: 12px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
}

.card img { width: 100%; height: 100%; object-fit: cover; }

.overlay-text {
  position: absolute;
  bottom: 0;
  padding: 12px;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  width: 100%;
  font-weight: 600;
}

.block {
  margin: 20px 0;
}

.item {
  background: #1f2937;
  padding: 12px;
  border-radius: 8px;
  margin: 8px 0;
}

.highlight {
  background: #2563eb;
  padding: 15px;
  border-radius: 10px;
  margin: 15px 0;
  font-weight: 600;
}

.back {
  position: fixed;
  top: 10px;
  left: 10px;
  background: #1f2937;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="screen active">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones técnicas en energía y aire comprimido</p>
    <button onclick="ir('menu')">Ver equipos</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <div class="container">
    <h2>Equipos</h2>

    <div class="card" onclick="verEquipo('grupo')">
      <img src="img/grupoelectrogeno.jpeg">
      <div class="overlay-text">Grupo electrógeno</div>
    </div>

    <div class="card" onclick="verEquipo('moto')">
      <img src="img/moto.jpg">
      <div class="overlay-text">Motocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('electro')">
      <img src="img/electro.jpg">
      <div class="overlay-text">Electrocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('torre')">
      <img src="img/torre.jpg">
      <div class="overlay-text">Torre iluminación</div>
    </div>

  </div>
</div>

<!-- DETALLE -->
<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <div class="container">
    <img id="imagen" style="width:100%;border-radius:10px;">
    <h2 id="titulo"></h2>
    <p id="descripcion"></p>

    <div id="beneficio" class="highlight"></div>

    <div id="contenido"></div>
  </div>
</div>

<script>

function ir(p) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(p).classList.add('active');
}

function verEquipo(nombre) {

  let data = {

    grupo: {
      titulo: "Grupo electrógeno",
      img: "img/grupoelectrogeno.jpeg",
      desc: "Equipos diseñados para garantizar suministro eléctrico continuo en industrias, obras y operaciones críticas.",
      beneficio: "✔ Evitá paradas de producción y reducí costos por fallas inesperadas",

      problemas: [
        "Sobrecalentamiento del motor",
        "Pérdida de potencia",
        "Fallas eléctricas",
        "Aceite degradado o contaminado"
      ],

      soluciones: [
        "Mantenimiento del sistema de refrigeración",
        "Cambio de filtros de aire, aceite y combustible",
        "Diagnóstico eléctrico completo",
        "Revisión de inyección y combustión"
      ],

      servicios: [
        "Mantenimiento preventivo programado",
        "Cambio de aceite y filtros",
        "Control de parámetros operativos",
        "Revisión mecánica integral",
        "Servicio técnico en campo",
        "Diagnóstico y reparación de fallas"
      ]
    },

    moto: {
      titulo: "Motocompresor",
      img: "img/moto.jpg",
      desc: "Equipos de aire comprimido para aplicaciones industriales y obra.",
      beneficio: "✔ Mejorá la eficiencia y evitá caídas de presión en tu operación",

      problemas: [
        "Baja presión de aire",
        "Fugas en el sistema",
        "Ruidos anormales",
        "Sobrecalentamiento"
      ],

      soluciones: [
        "Ajuste de válvulas",
        "Reparación de fugas",
        "Revisión mecánica",
        "Mantenimiento del sistema de enfriamiento"
      ],

      servicios: [
        "Cambio de aceite",
        "Cambio de filtros",
        "Control de presión",
        "Mantenimiento general",
        "Servicio en obra"
      ]
    },

    electro: {
      titulo: "Electrocompresor",
      img: "img/electro.jpg",
      desc: "Soluciones eficientes de aire comprimido para uso continuo.",
      beneficio: "✔ Reducí consumo energético y mejorá el rendimiento del sistema",

      problemas: [
        "Paradas inesperadas",
        "Fallas eléctricas",
        "Fugas de aire",
        "Baja eficiencia"
      ],

      soluciones: [
        "Diagnóstico eléctrico",
        "Reparación de componentes",
        "Sellado de pérdidas",
        "Optimización del rendimiento"
      ],

      servicios: [
        "Mantenimiento técnico",
        "Revisión eléctrica",
        "Cambio de aceite",
        "Control de consumo",
        "Testeo de funcionamiento"
      ]
    },

    torre: {
      titulo: "Torre de iluminación",
      img: "img/torre.jpg",
      desc: "Equipos de iluminación para obras, eventos y trabajos nocturnos.",
      beneficio: "✔ Asegurá iluminación continua y evitá interrupciones en el trabajo",

      problemas: [
        "Fallas de iluminación",
        "Problemas de batería",
        "Desgaste general",
        "Fallos eléctricos"
      ],

      soluciones: [
        "Cambio de lámparas",
        "Revisión eléctrica",
        "Control de batería",
        "Ajustes generales"
      ],

      servicios: [
        "Mantenimiento completo",
        "Reemplazo de luminarias",
        "Revisión eléctrica",
        "Servicio técnico en campo"
      ]
    }

  };

  let eq = data[nombre];

  document.getElementById("titulo").innerText = eq.titulo;
  document.getElementById("descripcion").innerText = eq.desc;
  document.getElementById("imagen").src = eq.img;
  document.getElementById("beneficio").innerText = eq.beneficio;

  let cont = document.getElementById("contenido");
  cont.innerHTML = "";

  function crearBloque(titulo, lista) {
    let div = document.createElement("div");
    div.className = "block";

    let h = document.createElement("h3");
    h.innerText = titulo;
    div.appendChild(h);

    lista.forEach(item => {
      let i = document.createElement("div");
      i.className = "item";
      i.innerText = item;
      div.appendChild(i);
    });

    cont.appendChild(div);
  }

  crearBloque("Problemas comunes", eq.problemas);
  crearBloque("Soluciones", eq.soluciones);
  crearBloque("Servicios que ofrecemos", eq.servicios);

  ir("detalle");
}

</script>

</body>
</html>
