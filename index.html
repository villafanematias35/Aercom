<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aercom</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #020617;
  --card: #0f172a;
  --accent: #3b82f6;
  --text: #e2e8f0;
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
}

/* CONTENEDOR */
.container {
  max-width: 720px;
  margin: auto;
  padding: 25px;
}

/* PANTALLAS */
.screen { display: none; }
.active { display: block; }

/* ANIMACIÓN */
.fade {
  animation: fadeIn 0.4s ease;
}
@keyframes fadeIn {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}

/* BOTONES */
button {
  padding: 14px 26px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  font-weight: 500;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(37,99,235,0.3);
}

/* BACK */
.back {
  position: fixed;
  top: 15px;
  left: 15px;
  background: rgba(15,23,42,0.8);
  backdrop-filter: blur(10px);
  padding: 10px 14px;
  font-size: 20px;
  border-radius: 12px;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 30px;
  background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
              url("imagen/inicio.jpeg") center/cover no-repeat;
}

.hero h1 {
  font-size: 42px;
}

.hero p {
  margin: 10px 0 30px;
  opacity: 0.8;
}

/* TARJETAS */
.card {
  position: relative;
  height: 230px;
  border-radius: 22px;
  overflow: hidden;
  margin-bottom: 25px;
  cursor: pointer;
  transition: 0.35s;
}

.card:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
}

.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.6);
}

.overlay-text {
  position: absolute;
  bottom: 0;
  padding: 25px;
  font-size: 22px;
  font-weight: 600;
  background: linear-gradient(transparent, rgba(0,0,0,0.9));
}

/* DETALLE */
.hero-img img {
  width: 100%;
  height: 340px;
  object-fit: cover;
  border-radius: 22px;
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}

.overlay {
  margin-top: 10px;
  padding: 10px 0;
  font-size: 26px;
  font-weight: 600;
}

#descripcion {
  opacity: 0.85;
  margin-bottom: 20px;
}

/* PROBLEMAS */
.problem {
  background: linear-gradient(145deg,#0f172a,#020617);
  padding: 16px;
  border-radius: 14px;
  margin: 12px 0;
  border-left: 4px solid var(--accent);
}

/* 📱 RESPONSIVE */
@media (max-width: 600px) {

  .container {
    padding: 15px;
  }

  .hero h1 {
    font-size: 30px;
  }

  .hero p {
    font-size: 14px;
  }

  .card {
    height: 180px;
  }

  .overlay-text {
    font-size: 18px;
    padding: 15px;
  }

  .hero-img img {
    height: 220px;
  }

}
</style>
</head>

<body>

<!-- INICIO -->
<div id="inicio" class="screen active fade">
  <div class="hero">
    <h1>AERCOM</h1>
    <p>Soluciones en energía y aire comprimido</p>
    <button onclick="ir('menu')">Explorar</button>
  </div>
</div>

<!-- MENU -->
<div id="menu" class="screen">
  <button class="back" onclick="ir('inicio')">←</button>

  <div class="container">
    <h2 style="margin-top:50px;">Seleccioná un equipo</h2>

    <div class="card" onclick="verEquipo('grupo')">
      <img src="imagen/grupo.jpg">
      <div class="overlay-text">⚡ Grupo electrógeno</div>
    </div>

    <div class="card" onclick="verEquipo('moto')">
      <img src="imagen/moto.jpg">
      <div class="overlay-text">🔧 Motocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('electro')">
      <img src="imagen/electro.jpg">
      <div class="overlay-text">🌀 Electrocompresor</div>
    </div>

    <div class="card" onclick="verEquipo('torre')">
      <img src="imagen/torre.jpg">
      <div class="overlay-text">💡 Torre de iluminación</div>
    </div>

  </div>
</div>

<!-- DETALLE -->
<div id="detalle" class="screen">
  <button class="back" onclick="ir('menu')">←</button>

  <div class="container">

    <div class="hero-img">
      <img id="imagen" src="">
    </div>

    <div class="overlay">
      <div id="titulo"></div>
    </div>

    <p id="descripcion"></p>

    <h3>Soluciones</h3>
    <div id="problemas"></div>

  </div>
</div>

<script>
function ir(pantalla) {
  document.querySelectorAll('.screen').forEach(s => {
    s.classList.remove('active','fade');
  });

  let screen = document.getElementById(pantalla);
  screen.classList.add('active','fade');
}

function verEquipo(nombre) {

  let data = {
    grupo: {
      titulo: "Grupo electrógeno",
      img: "imagen/grupo.jpg",
      desc: "Energía confiable para operaciones críticas.",
      problemas: [
        "🔥 Sobrecalentamiento → Limpieza de radiador",
        "⚠️ Bajo rendimiento → Cambio de filtros",
        "🔌 Fallas eléctricas → Diagnóstico completo"
      ]
    },
    moto: {
      titulo: "Motocompresor",
      img: "imagen/moto.jpg",
      desc: "Compresión eficiente para uso industrial.",
      problemas: [
        "⚠️ Baja presión → Ajuste de válvulas",
        "🔧 Ruido → Revisión mecánica"
      ]
    },
    electro: {
      titulo: "Electrocompresor",
      img: "imagen/electro.jpg",
      desc: "Soluciones eléctricas eficientes.",
      problemas: [
        "⛔ Paradas → Control eléctrico",
        "💨 Fugas → Sellado"
      ]
    },
    torre: {
      titulo: "Torre de iluminación",
      img: "imagen/torre.jpg",
      desc: "Iluminación para obras y eventos.",
      problemas: [
        "💡 Falla de luz → Cambio de lámparas",
        "🔋 Batería → Revisión eléctrica"
      ]
    }
  };

  let eq = data[nombre];

  document.getElementById("titulo").innerText = eq.titulo;
  document.getElementById("descripcion").innerText = eq.desc;
  document.getElementById("imagen").src = eq.img;

  let cont = document.getElementById("problemas");
  cont.innerHTML = "";

  eq.problemas.forEach(p => {
    let div = document.createElement("div");
    div.className = "problem";
    div.innerHTML = "➡️ " + p;
    cont.appendChild(div);
  });

  ir("detalle");
}
</script>

</body>
</html>
